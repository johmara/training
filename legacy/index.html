<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9-Week Hybrid Training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            font-size: 16px;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-card {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            color: #60a5fa;
        }

        .login-card p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .pin-display {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .pin-digit {
            width: 50px;
            height: 50px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 8px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60a5fa;
            font-weight: bold;
        }

        .pin-digit.filled {
            background: #60a5fa;
            color: #0f172a;
            border-color: #60a5fa;
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .pin-btn {
            padding: 1rem;
            background: #334155;
            border: none;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .pin-btn:active {
            background: #475569;
            transform: scale(0.95);
        }

        .pin-btn.action {
            grid-column: span 2;
            background: #ef4444;
            font-size: 1rem;
        }

        .pin-btn.action:active {
            background: #dc2626;
        }

        .pin-btn.submit {
            grid-column: span 2;
            background: #10b981;
            font-size: 1rem;
        }

        .pin-btn.submit:active {
            background: #059669;
        }

        .app-screen {
            display: none;
            min-height: 100vh;
            padding: 1rem;
            padding-bottom: 2rem;
            background: #0f172a;
        }

        .app-screen.active {
            display: block;
        }

        .header {
            background: #1e293b;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 {
            font-size: 1.25rem;
            color: #60a5fa;
            flex: 1;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            background: #ef4444;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .logout-btn:active {
            background: #dc2626;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 0.6rem 1rem;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: #e2e8f0;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 0.9rem;
            -webkit-tap-highlight-color: transparent;
            flex: 1;
            min-width: 80px;
        }

        .control-btn:active {
            background: #475569;
        }

        .control-btn.active {
            background: #60a5fa;
            color: #0f172a;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .week-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .week-header {
            background: #334155;
            padding: 1rem;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .week-header:active {
            background: #475569;
        }

        .week-content {
            display: none;
            padding: 1rem;
        }

        .week-content.expanded {
            display: block;
        }

        .day-block {
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #334155;
        }

        .day-block:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .day-name {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }

        .day-session {
            color: #cbd5e1;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            padding-left: 0;
        }

        .session-btn {
            background: #334155;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            color: #60a5fa;
            cursor: pointer;
            font-size: 0.8rem;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
            text-align: left;
        }

        .session-btn:active {
            background: #475569;
        }

        .session-exercises {
            display: none;
            background: #0f172a;
            border-radius: 4px;
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .session-exercises.expanded {
            display: block;
        }

        .exercise-list-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #334155;
        }

        .exercise-list-item:last-child {
            border-bottom: none;
        }

        .exercise-list-name {
            font-weight: 600;
            color: #60a5fa;
        }

        .exercise-list-detail {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }

        .circuit-section {
            background: linear-gradient(135deg, #1f3a5f 0%, #1e2d4a 100%);
            border-left: 4px solid #60a5fa;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .circuit-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #60a5fa;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .circuit-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #60a5fa;
            color: #0f172a;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .finisher-section {
            background: linear-gradient(135deg, #1f3f2f 0%, #1d2d24 100%);
            border-left: 4px solid #10b981;
            border-radius: 6px;
            padding: 1rem;
        }

        .finisher-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #10b981;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .finisher-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #10b981;
            color: #0f172a;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            max-width: 100%;
            width: 100%;
            padding: 1.5rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .modal-header h2 {
            color: #60a5fa;
            font-size: 1.25rem;
            flex: 1;
            word-break: break-word;
        }

        .close-modal {
            background: none;
            border: none;
            color: #e2e8f0;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .exercises-list {
            display: grid;
            gap: 1rem;
        }

        .exercise-item {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid #60a5fa;
        }

        .exercise-name {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        .exercise-detail {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 0.25rem;
        }

        .exercise-label {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .video-search {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .video-search input {
            flex: 1;
            padding: 0.5rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.85rem;
            min-width: 150px;
        }

        .video-search button {
            padding: 0.5rem 1rem;
            background: #60a5fa;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            -webkit-tap-highlight-color: transparent;
        }

        .video-search button:active {
            background: #3b82f6;
        }

        .export-btn {
            padding: 0.75rem 1rem;
            background: #10b981;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            -webkit-tap-highlight-color: transparent;
        }

        .export-btn:active {
            background: #059669;
        }

        @media (min-width: 768px) {
            .schedule-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .schedule-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .controls {
                gap: 1rem;
            }

            .control-btn {
                flex: none;
                min-width: auto;
            }
        }
    </style>
</head>

        function buildExerciseList(sessionName) {
            const exercises = sessions[sessionName] || [];
            if (exercises.length === 0) return '<div style="color: #94a3b8; font-size: 0.85rem;">No exercises listed</div>';

            const circuitEx = exercises.filter(e => e.type === 'circuit');
            const finisherEx = exercises.filter(e => e.type === 'finisher');
            const otherEx = exercises.filter(e => !e.type);

            let html = '';

            if (circuitEx.length > 0) {
                html += `<div class="circuit-section">
                    <div class="circuit-header">
                        <span class="circuit-icon">⊛</span>
                        Circuit (10 rounds, 60s on/30s rest)
                    </div>`;
                html += circuitEx.map(ex => `
                    <div class="exercise-list-item">
                        <div class="exercise-list-name">${ex.name}</div>
                        <div class="exercise-list-detail">${ex.sets}${ex.reps ? ' ' + ex.reps : ''} | ${ex.load}</div>
                    </div>
                `).join('');
                html += '</div>';
            }

            if (finisherEx.length > 0) {
                html += `<div class="finisher-section">
                    <div class="finisher-header">
                        <span class="finisher-icon">✓</span>
                        Finishers (after circuit)
                    </div>`;
                html += finisherEx.map(ex => `

                        <div class="exercise-list-name">${ex.name}</div>
                        <div class="exercise-list-detail">${ex.sets}${ex.reps ? ' ' + ex.reps : ''} | ${ex.load}</div>
                    </div>
                `).join('');
                html += '</div>';
            }

            if (otherEx.length > 0) {
                html += '<div style="background: #0f172a; border-radius: 6px; padding: 1rem;">';
                html += otherEx.map(ex => `
                    <div class="exercise-list-item">
                        <div class="exercise-list-name">${ex.name}</div>
                        <div class="exercise-list-detail">${ex.sets}${ex.reps ? ' ' + ex.reps : ''} | ${ex.load}</div>
                    </div>
                `).join('');
                html += '</div>';
            }

            return html;
        }

        function renderSchedule(filter = 'all') {

            grid.innerHTML = '';

            const filtered = schedule.filter(w => filter === 'all' || w.block === filter);

                const card = document.createElement('div');
                card.className = 'week-card';
                card.innerHTML = `
                    <div class="week-header" data-week="${week.week}">
                        <span>Week ${week.week}</span>
                        <span>▼</span>
                    </div>
                    <div class="week-content">
                        ${week.days.map(day => `

                                <div class="day-name">${day.name}</div>
                                <div class="day-session">${day.session}</div>
                                ${day.session !== 'Rest' ? `

                                        ${buildExerciseList(day.session)}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.week-header').forEach(header => {
                header.addEventListener('click', function() {

                    content.classList.toggle('expanded');

        function exportWorkout(sessionName) {
            const exercises = sessions[sessionName] || [];
            const tcx = generateWorkoutTCX(sessionName, exercises);
            downloadFile(tcx, `${sessionName.replace(/\s+/g, '-')}.tcx`, 'application/xml');
        }

        function generateWorkoutTCX(sessionName, exercises) {
            let tcxContent = `<?xml version="1.0" encoding="UTF-8"?>
<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2">
  <Workouts>
    <Workout Sport="Other">
      <Name>${sessionName}</Name>`;

            exercises.forEach((ex, idx) => {
                tcxContent += `
      <Step>
        <StepName>${ex.name}</StepName>
        <Duration><TimeSeconds>600</TimeSeconds></Duration>
        <Intensity>Active</Intensity>
        <Notes>Sets: ${ex.sets}${ex.reps} | Load: ${ex.load} | ${ex.notes}</Notes>
      </Step>`;
            });

            tcxContent += `
    </Workout>
  </Workouts>
</TrainingCenterDatabase>`;
            return tcxContent;
        }

        function loadYouTubeVideo(query) {
            if (!query) return;
            window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');

            const tcx = generateTCX();

        function generateTCX() {
            let tcxContent = `<?xml version="1.0" encoding="UTF-8"?>
<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2">
  <Workouts>`;

            schedule.forEach(week => {
                week.days.forEach(day => {
                    if (day.session !== 'Rest') {
                        const exercises = sessions[day.session] || [];
                        tcxContent += `
    <Workout Sport="Other">
      <Name>W${week.week} ${day.name}: ${day.session}</Name>
      <Step>
        <StepName>${day.session}</StepName>
        <Duration><TimeSeconds>3600</TimeSeconds></Duration>
        <Intensity>Active</Intensity>
        <Notes>${exercises.map(e => `${e.name}: ${e.sets}${e.reps}`).join(' | ')}</Notes>
      </Step>
    </Workout>`;
                    }
                });
            });

            tcxContent += `
  </Workouts>
</TrainingCenterDatabase>`;
            return tcxContent;
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('appScreen').classList.remove('active');
